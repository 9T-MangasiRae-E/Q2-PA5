<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Latest compiled and minified CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container bg-secondary rounded-3 mt-3 p-5">
        <form action="" method="post">

            <h2 class="text-info">Custom Sneaker Order Form</h2>

            <div class="form-group">
                <label class="form-label" for="form-name">Name:</label>
                <input class="form-control" type="text" name="username" id="form-name" class="textinput">
            </div>
        
            <div class="form-group">
                <label class="form-label" for="form-email">Email:</label>
                <input class="form-control" type="email" name="emailaddress" id="form-email"class="textinput">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="form-tel">Telephone:</label>
             <input class="form-control" type="tel" name="telephone" id="form-tel"class="textinput">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="form-story">Tell us about yourself:</label>
                <textarea class="form-control" name="story" maxlength="600" id="form-story" placeholder="No more than 600 characters long"></textarea>
            </div>
            
            
            <label class="form-label" for="sizes">Size:</label>
            <select class="form-select" name="size" id="sizes">
                <option>5</option>
                <option>6</option>
                <option>7</option>
                <option>8</option>
                <option>9</option>
                <option>10</option>
                <option>11</option>
                <option>12</option>
                <option>13</option>
            </select> 
            
            <em>Sizes reflect standard US men's sizes</em>
                
            <label for="colors">Sneaker Color:</label>
            <fieldset id="colors">
                <legend>Color</legend>
                <div class="form-check">
                    <label class="form-check-label"><input class="form-check-input" type="radio" name="color" value="red"> Red</label>
                </div>
                <div class="form-check">
                    <label class="form-check-label"><input class="form-check-input" type="radio" name="color" value="blue"> Blue</label>
                </div>
                <div class="form-check">
                    <label class="form-check-label"><input class="form-check-input" type="radio" name="color" value="black"> Black</label>
                </div>
                <div class="form-check">
                    <label class="form-check-label"><input class="form-check-input" type="radio" name="color" value="silver"> Silver</label>
                </div>
                
            </fieldset>
                
            <label class="mt-5" for="features">Add-on Features:</label>
            <fieldset id="features">
                <legend>Feature</legend>
                <div class="form-check">
                    <label class="form-check-label"><input class="form-check-input" type="checkbox" name="feature" value="laces"> Sparkley laces</label>
                </div>
                <div class="form-check">
                    <label class="form-check-label"><input class="form-check-input" type="checkbox" name="feature" value="logo" checked> Metallic logo</label>
                </div>
                <div class="form-check">
                    <label class="form-check-label"><input class="form-check-input" type="checkbox" name="feature" value="heels"> Light-up heels</label>
                </div>
                <div class="form-check">
                    <label class="form-check-label"><input class="form-check-input" type="checkbox" name="feature" value="mp3"> MP3-enabled</label> 
                </div>
                
                
                
            </fieldset>
                
            <button class="btn btn-info text-white mt-3" type="submit">ENTER</button>
        </form>
    </div>


    
    <!-- FOOTER -->
 <div class="footer">
        <p>© 2026 | Rae Kaitlyn E. Mangasi | 9 - Topaz</p>
    </div>

    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
